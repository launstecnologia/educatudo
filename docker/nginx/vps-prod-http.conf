# EducaTudo — VPS produção (HTTP, porta 80)
# Atende master + tenants. Cloudflare Flexible funciona só com este bloco.
# Para HTTPS na origem (Full strict): emitir cert e usar docker-compose.vps.ssl.yml

upstream php_fpm {
    server php:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name educatudo.com *.educatudo.com master.educatudo.com _;

    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    client_max_body_size 100M;

    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ^~ /uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /public/static/ {
        alias /var/www/html/public/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /public/assets/ {
        alias /var/www/html/public/assets/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /storage/images/ {
        alias /var/www/html/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
