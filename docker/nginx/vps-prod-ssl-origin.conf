# HTTPS com certificado Origin da Cloudflare (gerado no painel, sem API token)
# Arquivos esperados em ssl/cloudflare-origin.pem e ssl/cloudflare-origin.key

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name educatudo.com *.educatudo.com master.educatudo.com;

    # IP real do cliente atrás da Cloudflare (REMOTE_ADDR no PHP).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    ssl_certificate     /etc/ssl/educatudo/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/educatudo/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ^~ /uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /public/static/ {
        alias /var/www/html/public/static/;
        expires 30d;
    }

    location ^~ /public/assets/ {
        alias /var/www/html/public/assets/;
        expires 30d;
    }

    location ^~ /storage/images/ {
        alias /var/www/html/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sem isto, .php inexistente vira "File not found." do PHP-FPM (sem a 404 custom).
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
