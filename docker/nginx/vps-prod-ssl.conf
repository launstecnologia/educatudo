# EducaTudo — VPS produção (HTTPS, porta 443)
# Só monte este arquivo DEPOIS de emitir o cert wildcard (scripts/setup-vps-ssl-docker.sh)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name educatudo.com *.educatudo.com master.educatudo.com;

    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/educatudo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educatudo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
    }

    location ^~ /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
    }

    location ^~ /public/static/ {
        alias /var/www/html/public/static/;
        expires 30d;
    }

    location ^~ /storage/chat/ {
        alias /var/www/html/storage/chat/;
        expires 1d;
    }

    location ^~ /storage/images/ {
        alias /var/www/html/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
