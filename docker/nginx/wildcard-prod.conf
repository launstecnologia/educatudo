# Nginx wildcard — EducaTudo produção
# Um vhost atende master + todos os tenants (*.educatudo.com).
# Ajuste root, socket PHP e paths do certificado conforme o servidor.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name educatudo.com *.educatudo.com master.educatudo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name educatudo.com *.educatudo.com master.educatudo.com;

    # IP real do cliente atrás da Cloudflare (REMOTE_ADDR no PHP).
    # Copie docker/nginx/cloudflare-real-ip.conf para este path no servidor, ou ajuste o include.
    include /www/wwwroot/educatudo/docker/nginx/cloudflare-real-ip.conf;

    # Raiz = backend/public (front controller)
    root /www/wwwroot/educatudo/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/educatudo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educatudo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    location ^~ /uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /public/static/ {
        alias /www/wwwroot/educatudo/backend/public/static/;
        expires 30d;
    }

    location ^~ /storage/images/ {
        alias /www/wwwroot/educatudo/backend/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sem isto, .php inexistente vira "File not found." do PHP-FPM (sem a 404 custom).
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_read_timeout 300;
    }
}
