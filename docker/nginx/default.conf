# EducaTudo — docroot = public/ ; bloqueia app/, vendor/, storage/, bootstrap/, config/

upstream php_fpm {
    server php:9000;
}

server {
    listen 80;
    server_name master.localhost colag.localhost *.localhost localhost;

    root /var/www/html/public;
    index index.php;

    # ── Bloqueio explícito de pastas sensíveis (fora do docroot) ──
    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Uploads legados (URL /public/uploads/...)
    location ^~ /public/uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Uploads diretos (/uploads/ → public/uploads/)
    location ^~ /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Assets legados (URL /public/static/... — docroot já é public/)
    location ^~ /public/static/ {
        alias /var/www/html/public/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Storage público controlado (subpastas específicas)
    location ^~ /storage/chat/ {
        alias /var/www/html/storage/chat/;
        expires 1d;
    }

    location ^~ /storage/images/ {
        alias /var/www/html/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Assets estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
