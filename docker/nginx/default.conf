# EducaTudo — docroot = public/ ; bloqueia app/, vendor/, storage/, bootstrap/, config/

upstream php_fpm {
    server php:9000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 master.localhost colag.localhost *.localhost;

    root /var/www/html/public;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    # ── Bloqueio explícito de pastas sensíveis (fora do docroot) ──
    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Caderno do aluno: arquivo só sai pelo controller, com sessão.
    location ^~ /uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/cadernos_aluno/ {
        deny all;
        return 404;
    }

    # As duas entradas passam pelo PHP. Nginx não entrega o arquivo direto.
    location ^~ /public/uploads/ {
        rewrite ^ /index.php last;
    }

    location ^~ /uploads/ {
        rewrite ^ /index.php last;
    }

    # Assets legados (URL /public/static/... — docroot já é public/)
    location ^~ /public/static/ {
        alias /var/www/html/public/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /public/assets/ {
        alias /var/www/html/public/assets/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Imagens públicas do storage
    location ^~ /storage/images/ {
        alias /var/www/html/storage/images/;
        expires 1d;
    }

    # Legado estritamente controlado: somente anexos de comunicação escolar
    location ^~ /storage/uploads/fale-com-a-escola/ {
        rewrite ^ /index.php last;
    }
    location ^~ /storage/uploads/school-communications/ {
        rewrite ^ /index.php last;
    }

    # Demais pastas em /storage/ continuam bloqueadas
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Assets estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sem isto, .php inexistente vira "File not found." do PHP-FPM (sem a 404 custom).
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
