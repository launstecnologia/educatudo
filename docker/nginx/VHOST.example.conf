# Exemplo de vhost Nginx — EducaTudo (produção)
# Ajuste server_name, root e paths de log conforme o servidor.

server {
    listen 80;
    listen 443 ssl http2;
    server_name escola.exemplo.com;

    # Raiz do repo no servidor (NÃO é o docroot)
    # root deve ser .../public
    root /www/wwwroot/master.educatudo.com/public;
    index index.php;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    location ~ ^/(app|bootstrap|vendor|storage|database|config|cron|scripts|node_modules|mcp|doc_sistema|docs|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ^~ /public/uploads/ {
        alias /www/wwwroot/master.educatudo.com/public/uploads/;
        expires 7d;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/master.educatudo.com/public/uploads/;
        expires 7d;
    }

    location ^~ /public/static/ {
        alias /www/wwwroot/master.educatudo.com/public/static/;
        expires 30d;
    }

    location ^~ /storage/chat/ {
        alias /www/wwwroot/master.educatudo.com/storage/chat/;
        expires 1d;
    }

    location ^~ /storage/images/ {
        alias /www/wwwroot/master.educatudo.com/storage/images/;
        expires 1d;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;  # ajustar socket PHP do aaPanel
        fastcgi_read_timeout 300;
    }
}
