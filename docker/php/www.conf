[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
; VPS 4 vCPU / 16 GB — reserva ~4 GB para PHP com memory_limit 128M
; start/spare elevados reduzem ramp-up do pool em picos; NÃO subir max_children
; enquanto a CPU já saturar (mais workers aumentam contenção).
pm.max_children = 50
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 30
pm.max_requests = 500
request_terminate_timeout = 120
clear_env = no
