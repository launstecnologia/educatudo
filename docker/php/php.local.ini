; Override só no Docker local (docker-compose.yml). A VPS continua com php.ini.
display_errors = On
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 120

; Recarrega código alterado no bind mount (sem isso o OPcache da VPS congela o PHP)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
