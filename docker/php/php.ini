; EducaTudo — hardening PHP
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
memory_limit = 512M

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
