[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
; Container local tem mem_limit 512m — o www.conf da VPS (20 start × 128M) estoura a memória
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 120
clear_env = no
