services:
  educasync-solver:
    build: .
    container_name: educatudo-educasync-solver
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      APP_NAME: educasync-solver
      APP_ENV: local
      PORT: "8091"
      INTERNAL_API_KEY: educasync_local_dev
      MAX_TIME_S_LIMITE: "300"
      MAX_WORKERS_LIMITE: "8"
