<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Serviço indisponível — EducaTudo</title>
    <style>
        :root {
            --azul: #082B55;
            --azul-escuro: #061f3d;
            --texto: #1e293b;
            --muted: #64748b;
            --fundo: #f1f5f9;
            --branco: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--texto);
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(8, 43, 85, 0.12), transparent),
                var(--fundo);
        }
        main {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo {
            height: 48px;
            width: auto;
            margin: 0 auto 28px;
            display: block;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--azul-escuro);
        }
        p {
            margin: 0 0 28px;
            font-size: 0.95rem;
            line-height: 1.55;
            color: var(--muted);
        }
        a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            background: var(--azul);
            color: var(--branco);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }
        a:hover { background: var(--azul-escuro); }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/assets/logos/logo-educatudo-black.png" alt="EducaTudo" width="180" height="48">
        <h1>Serviço temporariamente indisponível</h1>
        <p>Estamos com uma instabilidade no momento. Tente de novo em alguns minutos.</p>
        <a href="/">Voltar ao início</a>
    </main>
</body>
</html>
