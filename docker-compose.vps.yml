# EducaTudo — VPS (MySQL remoto, sem container mysql)
# Uso: ./scripts/up-vps.sh
#
# Configure backend/.env com DB_HOST apontando para o MySQL externo
# (IP/host acessível a partir do container php na rede Docker).
#
# Capacidade sugerida (VPS 4 vCPU / 16 GB): PHP_MEM_LIMIT=4g (default).
# Override na raiz: echo 'PHP_MEM_LIMIT=4g' >> .env

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_educatudo
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/vps-prod-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: educatudo-php:latest
    container_name: php_app_educatudo
    # Default 4g — alinhado a pm.max_children=50 × memory_limit=128M na VPS 16 GB
    mem_limit: ${PHP_MEM_LIMIT:-4g}
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_educatudo
    command:
      [
        "redis-server",
        "--maxmemory", "256mb",
        "--maxmemory-policy", "allkeys-lru",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--save", "900", "1",
        "--save", "300", "10",
        "--save", "60", "10000"
      ]
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
